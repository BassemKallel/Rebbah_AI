server {
    listen 80;
    server_name localhost;

    # Backend Orchestrator (Django API)
    # The frontend/webhook will call this endpoint
    location /api/ {
        proxy_pass http://backend-orchestrator:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_addrs;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hide the direct access to /admin
    # Either block it entirely from outside, or leave it proxy passed if you need access.
    location /admin/ {
        proxy_pass http://backend-orchestrator:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # Static files for Django Admin (this requires Django to collectstatic to a volume,
    # or you can just let Django handle them via runserver for local dev).
    # Since we are using runserver in local, we just pass static to it.
    location /static/ {
        proxy_pass http://backend-orchestrator:8000/static/;
    }
    
    # Deny direct outside access to internal AI services.
    # Note: If you want to test them via Postman manually, you CAN expose them on different paths, 
    # e.g., /internal-nlu/ -> http://nlu-service:8001
    # For now, we keep them strictly internal (so no location blocks for them = they return 404 on port 80).
}
