networks:
  internal-net:
  db-net:

services:
  backend-orchestrator:
    build: ./backend-orchestrator
    container_name: tiktak-ai-v2-backend
    restart: unless-stopped
    volumes:
      - ./backend-orchestrator:/app
    env_file:
      - .env
    environment:
      - META_APP_SECRET=${META_APP_SECRET}
      - META_VERIFY_TOKEN=${META_VERIFY_TOKEN}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY}
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py setup_initial_data &&
             (while true; do python manage.py expire_conversations; sleep 60; done) &
             (while true; do python manage.py retry_pending_messages; sleep 60; done) &
             python manage.py runserver 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      vision-service:
        condition: service_started
    ports:
      - "8010:8000"
    networks:
      - internal-net
      - db-net
    deploy:
      resources:
        limits:
          memory: 512m


  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-https://ai.tiktakpro.com}
    container_name: tiktak-ai-v2-frontend
    restart: unless-stopped
    depends_on:
      - backend-orchestrator
    ports:
      - "3011:3000"
    networks:
      - internal-net
    deploy:
      resources:
        limits:
          memory: 256m

  vision-service:
    build: ./vision-service
    container_name: tiktak-ai-v2-vision
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8020:8002"
    networks:
      - internal-net
      - db-net
    volumes:
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        limits:
          memory: 4g


  db:
    image: ankane/pgvector:v0.5.1
    container_name: tiktak-ai-v2-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768m

  redis:
    image: redis:7-alpine
    container_name: tiktak-ai-v2-redis
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: >
      sh -c "redis-server --save 60 1 --loglevel warning --requirepass $$REDIS_PASSWORD"
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  postgres_data:
  redis_data:
  hf_cache:
