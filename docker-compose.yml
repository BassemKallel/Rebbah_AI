version: '3.8'
services:
  backend-orchestrator:
    build: ./backend-orchestrator
    container_name: backend-orchestrator
    ports:
      - "8000:8000"
    volumes:
      - ./backend-orchestrator:/app
    env_file:
      - .env
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - db
      - redis
      - vector-db
      - nlu-service
      - vision-service
  nlu-service:
    build: ./nlu-service
    container_name: nlu-service
    ports:
      - "8001:8001"
  vision-service:
    build: ./vision-service
    container_name: vision-service
    ports:
      - "8002:8002"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  sync-worker:
    build: ./sync-worker
    container_name: sync-worker
  db:
    image: postgres:15
    container_name: postgres-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database-init/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  vector-db:
    image: ankane/pgvector:v0.5.1
    container_name: vector-db
    environment:
      POSTGRES_USER: ${VECTOR_DB_USER}
      POSTGRES_PASSWORD: ${VECTOR_DB_PASSWORD}
      POSTGRES_DB: ${VECTOR_DB_NAME}
    volumes:
      - vector_data:/var/lib/postgresql/data
    ports:
      - "${VECTOR_DB_PORT}:5432"

  redis:
    image: redis:7-alpine
    container_name: tiktak-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "8004:5540"
    depends_on:
      - redis
    volumes:
      - redisinsight_data:/data

volumes:
  postgres_data:
  vector_data:
  redis_data:
  redisinsight_data:
