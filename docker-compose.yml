version: '3.8'
services:
  backend-orchestrator:
    build: ./backend-orchestrator
    container_name: backend-orchestrator
    ports:
      - "8000:8000"
    volumes:
      - ./backend-orchestrator:/app
    env_file:
      - .env
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - db
      - redis
      - vector-db
      - nlu-service
      - vision-service
    deploy:
      resources:
        limits:
          memory: 512m
  nlu-service:
    build: ./nlu-service
    container_name: nlu-service
    ports:
      - "8001:8001"
    volumes:
      - ./nlu-service:/app
    deploy:
      resources:
        limits:
          memory: 2g
  vision-service:
    build: ./vision-service
    container_name: vision-service
    ports:
      - "8002:8002"
    deploy:
      resources:
        limits:
          memory: 4g
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  sync-worker:
    build: ./sync-worker
    container_name: sync-worker
    env_file:
      - .env
    environment:
      TIKTAK_API_BASE_URL: ${TIKTAK_API_BASE_URL}
      TIKTAK_API_TOKEN:    ${TIKTAK_API_TOKEN}
      COMPANY_SLUG:        ${COMPANY_SLUG}
      VISION_SERVICE_URL:  http://vision-service:8002/vectorize
    depends_on:
      - vision-service
    deploy:
      resources:
        limits:
          memory: 256m
  db:
    image: postgres:15
    container_name: postgres-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database-init/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          memory: 512m

  vector-db:
    image: ankane/pgvector:v0.5.1
    container_name: vector-db
    environment:
      POSTGRES_USER: ${VECTOR_DB_USER}
      POSTGRES_PASSWORD: ${VECTOR_DB_PASSWORD}
      POSTGRES_DB: ${VECTOR_DB_NAME}
    volumes:
      - vector_data:/var/lib/postgresql/data
    ports:
      - "${VECTOR_DB_PORT}:5432"
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    image: redis:7-alpine
    container_name: tiktak-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  postgres_data:
  vector_data:
  redis_data:
