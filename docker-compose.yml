version: "3.8"

networks:
  internal-net:
  db-net:

services:
  backend-orchestrator:
    build: ./backend-orchestrator
    container_name: backend-orchestrator
    restart: unless-stopped
    volumes:
      - ./backend-orchestrator:/app
    env_file:
      - .env
    environment:
      - META_APP_SECRET=${META_APP_SECRET}
      - META_VERIFY_TOKEN=${META_VERIFY_TOKEN}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY}
    command: >
      sh -c "python manage.py migrate crm 0021 --fake &&
             python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py setup_initial_data &&
             (while true; do python manage.py expire_conversations; sleep 60; done) &
             python manage.py runserver 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      nlu-service:
        condition: service_started
      vision-service:
        condition: service_started
    ports:
      - "8000:8000"
    networks:
      - internal-net
      - db-net
    deploy:
      resources:
        limits:
          memory: 512m

  nlu-service:
    build: ./nlu-service
    container_name: nlu-service
    restart: unless-stopped
    volumes:
      - ./nlu-service:/app
    ports:
      - "8001:8001"
    networks:
      - internal-net
    deploy:
      resources:
        limits:
          memory: 2g

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-https://ai.tiktakpro.com}
    container_name: tiktak-frontend
    restart: unless-stopped
    depends_on:
      - backend-orchestrator
    ports:
      - "3000:3000"
    networks:
      - internal-net
    deploy:
      resources:
        limits:
          memory: 256m

  vision-service:
    build: ./vision-service
    container_name: vision-service
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8002:8002"
    networks:
      - internal-net
      - db-net
    deploy:
      resources:
        limits:
          memory: 4g
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  sync-worker:
    build: ./sync-worker
    container_name: sync-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TIKTAK_API_BASE_URL: ${TIKTAK_API_BASE_URL}
      VISION_SERVICE_URL: http://vision-service:8002/vectorize
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      sh -c "echo '=== Sync Worker starting ===' &&
            python sync.py &&
            echo '=== Sync done. Next run in 24h ===' &&
            sleep 86400"
    depends_on:
      db:
        condition: service_healthy
      vision-service:
        condition: service_started
    networks:
      - internal-net
      - db-net
    deploy:
      resources:
        limits:
          memory: 256m

  db:
    image: ankane/pgvector:v0.5.1
    container_name: postgres-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768m

  redis:
    image: redis:7-alpine
    container_name: tiktak-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - db-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  postgres_data:
  redis_data:
