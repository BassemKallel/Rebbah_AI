version: '3.8'

networks:
  internal-net:
  db-net:

services:
  backend-orchestrator:
    build: ./backend-orchestrator
    container_name: backend-orchestrator
    restart: unless-stopped
    volumes:
      - ./backend-orchestrator:/app
    env_file:
      - .env
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      nlu-service:
        condition: service_started
      vision-service:
        condition: service_started
    ports:
      - "8000:8000"
    networks:
      - internal-net
      - db-net
    deploy:
      resources:
        limits:
          memory: 512m

  nlu-service:
    build: ./nlu-service
    container_name: nlu-service
    restart: unless-stopped
    volumes:
      - ./nlu-service:/app
    networks:
      - internal-net
    deploy:
      resources:
        limits:
          memory: 2g

  vision-service:
    build: ./vision-service
    container_name: vision-service
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - internal-net
      - db-net
    deploy:
      resources:
        limits:
          memory: 4g
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  sync-worker:
    build: ./sync-worker
    container_name: sync-worker
    env_file:
      - .env
    environment:
      TIKTAK_API_BASE_URL: ${TIKTAK_API_BASE_URL}
      TIKTAK_API_TOKEN:    ${TIKTAK_API_TOKEN}
      COMPANY_SLUG:        ${COMPANY_SLUG}
      VISION_SERVICE_URL:  http://vision-service:8002/vectorize
    depends_on:
      - vision-service
    networks:
      - internal-net
      - db-net
    deploy:
      resources:
        limits:
          memory: 256m

  db:
    image: ankane/pgvector:v0.5.1
    container_name: postgres-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database-init/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768m

  redis:
    image: redis:7-alpine
    container_name: tiktak-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - db-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  postgres_data:
  redis_data:
